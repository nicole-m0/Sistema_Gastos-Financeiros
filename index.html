<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/68415d66c2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body class="darkmode">
    <div class="title">
        <h1>Minhas Finanças</h1>
    </div>

    <main>
        <header id="ficha">
            <nav id="menu">
                <ul id="ulFicha">
                    <li><a href="#"><i class="fa-solid fa-moon"></i>Darkligth Theme</a></li>
                    <li><a href="#"><i class="fa-solid fa-arrow-up"></i>Entradas</a></li>
                    <li><a href="#"><i class="fa-solid fa-arrow-down"></i>Saídas</a></li>
                    <li><a href="#"><i class="fa-solid fa-list"></i>Lista Completa</a></li>
                </ul>
            </nav>
        </header>
        <div id="content">
            <div id="RCPContainer">
                <div id="receitas" class="rcp">
                    <i class="fa-solid fa-arrow-up" style="color: #37f4b5;"></i>
                    <p>Receitas</p>
                    <p id="valoReceita">0</p>
                </div>
                <div id="despesas" class="rcp">
                    <i class="fa-solid fa-arrow-down" style="color: #de062d;"></i>
                    <p>Despesas</p>
                    <p id="valorDespesa">0</p>
                </div>
                <div id="saldoTotal" class="rcp">
                    <i class="fa-solid fa-sack-dollar" style="color: #8B5CF6;"></i>
                    <p>Saldo Total</p>
                    <p id="valorsaldo">0</p>
                </div>
            </div>
            <div id="formContainer">
                <form action="">
                    <label for="descricao">Descrição: </label>
                    <input type="text" name="descricao" id="descricao" placeholder="Ex: mercado, salário..."> <br>
                    <label for="valor">valor (R$): </label>
                    <input type="number" name="valor" id="valor" placeholder="0,00"> <br>
                    <label for="categoria">Categoria</label>
                    <select name="categoria" id="categoria">
                        <option value="receita">Receita</option>
                        <option value="despesa">Despesa</option>
                    </select> <br>
                    <button id="btnAdd"><i class="fa-solid fa-plus"></i> Adicionar</button>
                </form>
            </div>
            <div id="listContainer">
                <h2>Histórico</h2>

                <ul id="historicoLista"></ul>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
